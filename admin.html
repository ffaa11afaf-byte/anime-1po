<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة التشفير -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* (نفس تنسيقاتك السابقة) */
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 15px; direction: rtl; }
        #errorOverlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; color: #444; font-family: monospace; font-size: 1rem; padding: 15px; text-align: left; direction: ltr; z-index: 999999; }
        #loginBox { display: none; max-width: 350px; margin: 80px auto 0 auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; text-align: center; }
        #loginBox h3 { color: #ff9800; margin-top: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        h1, h2 { color: #ff9800; text-align: center; margin-bottom: 15px; font-size: 1.3rem; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        label { display: block; margin: 8px 0 4px; font-size: 0.85rem; color: #bbb; }
        input, select { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 0.9rem; }
        .btn { display: block; width: 100%; background: #ff9800; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; margin-top: 12px; cursor: pointer; font-size: 0.95rem; text-align: center; }
        #app { display: none; }
        .status-msg { text-align: center; font-size: 0.85rem; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="errorOverlay">Error</div>
    <div id="loginBox">
        <h3>🔒 رمز الحماية</h3>
        <input type="password" id="passInput" placeholder="أدخل الرمز هنا">
        <button class="btn" onclick="checkPass()">دخول</button>
        <div id="loginErr" style="color:#ff5252; font-size:0.8rem; margin-top:8px;"></div>
    </div>

    <div id="app" class="container">
        <h1>🛠️ لوحة تحكم الأنميات</h1>
        <!-- (نفس حقول الإضافة السابقة) -->
        <div class="card">
            <h2>إضافة / تحديث أنمي</h2>
            <input type="text" id="animeId" placeholder="معرف الأنمي">
            <input type="text" id="animeTitle" placeholder="عنوان الأنمي">
            <input type="text" id="animePoster" placeholder="رابط البوستر">
            <select id="airDay"><option value="0">الأحد</option><option value="6">السبت</option></select>
            <input type="text" id="airTime" placeholder="21:00">
            <button class="btn" onclick="saveAnime()">حفظ البيانات</button>
            <div id="animeStatus" class="status-msg"></div>
        </div>
        <!-- (باقي الحقول...) -->
        <button class="btn" onclick="location.reload()">تحديث البيانات</button>
        <div id="animeList">جاري جلب البيانات...</div>
    </div>

    <script>
        const API_URL = "https://anime-api-proxy.ffaa11afaf.workers.dev";
        const SECRET_PASS = "18001900m"; // هذا الرمز هو مفتاح التشفير!
        const ADMIN_ID = 8649503815;
        let allAnimes = [];

        // دالة التشفير
        function encryptData(data) {
            return CryptoJS.AES.encrypt(JSON.stringify(data), SECRET_PASS).toString();
        }

        // دالة فك التشفير
        function decryptData(encryptedStr) {
            const bytes = CryptoJS.AES.decrypt(encryptedStr, SECRET_PASS);
            return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
        }

        // ... [باقي دوال الواجهة مثل fetchAnimes و saveToWorker] ...
        // في دالة الجلب:
        function fetchAnimes() {
            fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                // فك التشفير هنا
                const decrypted = decryptData(data.record.encryptedData);
                allAnimes = decrypted.animes || [];
                renderAnimeList(allAnimes);
            });
        }

        // في دالة الحفظ:
        function saveToWorker(animesData, onSuccess) {
            const encrypted = encryptData({ animes: animesData });
            fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ encryptedData: encrypted })
            })
            .then(() => onSuccess())
            .catch(err => alert("خطأ في الحفظ"));
        }
        
        // ... [بقية الدوال...]
    </script>
</body>
</html>
