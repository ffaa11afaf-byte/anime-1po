<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجهيز رابط التحميل...</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: white; margin: 0; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ff9800; font-size: 1.4rem; margin-bottom: 15px; }
        #timer { font-size: 1.1rem; color: #ddd; margin-bottom: 20px; }
        #count { color: #ff9800; font-weight: bold; font-size: 1.3rem; }
        #downloadBtn { display: none; background: #28a745; color: white; padding: 14px 35px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; text-decoration: none; transition: 0.3s; margin-top: 15px; }
        #downloadBtn:hover { background: #218838; }
        .ad-container { margin: 20px 0; min-height: 250px; display: flex; justify-content: center; align-items: center; }
        .error-box { color: #ff5252; font-size: 1.1rem; }
        .home-btn { display: inline-block; margin-top: 15px; color: #ff9800; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="box" id="mainBox">
        <h1 id="titleHeader">الرجاء الانتظار قليلاً...</h1>
        <p id="timer">سيكون رابط التحميل جاهزاً بعد <span id="count">10</span> ثوانٍ</p>

        <!-- مكان إعلان Adsterra (300x250) -->
        <div class="ad-container">
            <script type="text/javascript">
                atOptions = {
                    'key' : 'a563f906e29d3be56d9633c80cd288d7',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://unprofessionalginger.com/a563f906e29d3be56d9633c80cd288d7/invoke.js"></script>
        </div>

        <a id="downloadBtn" href="#">اضغط هنا للتحميل المباشر</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const encodedLink = params.get('link');
        const mainBox = document.getElementById('mainBox');
        
        if (encodedLink) {
            try {
                // فك التشفير بأمان
                const decodedLink = decodeURIComponent(escape(atob(decodeURIComponent(encodedLink))));
                
                let count = 10;
                const countDisplay = document.getElementById('count');
                const btn = document.getElementById('downloadBtn');
                const timerText = document.getElementById('timer');
                const titleHeader = document.getElementById('titleHeader');

                const interval = setInterval(() => {
                    count--;
                    countDisplay.innerText = count;
                    if(count <= 0) {
                        clearInterval(interval);
                        timerText.style.display = 'none';
                        titleHeader.innerText = "رابط التحميل جاهز الآن!";
                        btn.style.display = 'inline-block';
                        btn.href = decodedLink;
                    }
                }, 1000);
            } catch (e) {
                mainBox.innerHTML = `
                    <div class="error-box">
                        <h2>⚠️ رابط غير صالح أو منتهي الصلاحية</h2>
                        <a href="index.html" class="home-btn">العودة للرئيسية</a>
                    </div>
                `;
            }
        } else {
            mainBox.innerHTML = `
                <div class="error-box">
                    <h2>⚠️ لم يتم تحديد حلقة للتحميل</h2>
                    <p style="color:#aaa; font-size:0.85rem;">يرجى اختيار الحلقة من قائمة الأنميات أولاً.</p>
                    <a href="index.html" class="home-btn">العودة للرئيسية</a>
                </div>
            `;
        }
    </script>
    
    <!-- إعلان Adsterra Popunder -->
    <script type="text/javascript" src="https://unprofessionalginger.com/ba/f7/7a/baf77aaee3f0d50e9dfebfdf4df09587.js"></script>

</body>
</html>
