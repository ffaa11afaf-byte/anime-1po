    <style>
        * { box-sizing: border-box; font-family: sans-serif; text-decoration: none; }
        body { background: #121212; color: white; margin: 0; padding: 10px; text-align: center; padding-bottom: 50px; }
        
        .nav-bar { text-align: right; margin-bottom: 10px; }

        h1 { font-size: 1.2rem; color: #ff9800; margin: 10px 0; }
        
        .player-box { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; border: 1px solid #333; }
        .player-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .download-btn { display: none; background: #28a745; color: white; padding: 12px 25px; border-radius: 30px; font-weight: bold; margin-bottom: 20px; text-decoration: none; width: 90%; max-width: 300px; margin: 0 auto 15px auto; }
        .download-btn:hover { background: #218838; }

        .ep-section { border: 1px solid #333; border-radius: 8px; background: #1a1a1a; padding: 10px; margin-bottom: 10px; }
        .ep-title { font-weight: bold; color: #ff9800; margin-bottom: 8px; display: block; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .ep-links-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        
        .quality-btn { display: inline-block; background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .quality-btn:hover { background: #444; }
        .quality-btn.active { background: #ff9800; color: #000; font-weight: bold; }

        /* البطاقة المصغرة والمدمجة للعداد والتاريخ */
        .compact-info-card { background: rgba(255, 152, 0, 0.08); border: 1px solid rgba(255, 152, 0, 0.3); border-radius: 10px; padding: 10px 14px; margin: 20px auto; max-width: 500px; text-align: right; font-size: 0.82rem; }
        .info-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; color: #ddd; }
        .info-highlight { color: #ff9800; font-weight: bold; }
        .info-date { color: #bbb; font-size: 0.78rem; }
        
        .compact-timer-box { background: rgba(0, 0, 0, 0.4); border: 1px solid #2a2a2a; border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; direction: rtl; }
        .timer-label-sm { color: #aaa; font-size: 0.75rem; }
        .timer-values-sm { display: flex; gap: 4px; direction: ltr; font-family: monospace; font-size: 0.85rem; font-weight: bold; color: #ff9800; }
        .timer-unit-sm { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; border: 1px solid #333; }

        .completed-badge { background: rgba(40, 167, 69, 0.15); border: 1px solid #28a745; color: #28a745; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; margin: 20px auto; max-width: 500px; }

        footer { margin-top: 30px; font-size: 0.85rem; color: #888; }
        footer a { color: #ff9800; font-weight: bold; }
        .loading-text { color: #ff9800; font-size: 1rem; margin: 20px 0; }
    </style>

<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">➔ العودة لقائمة الأنميات</a>
    </div>

    <h1 id="animeHeaderTitle">جاري التحميل...</h1>

    <div class="player-box">
        <div class="player-container">
            <iframe id="videoPlayer" src="" allowfullscreen scrolling="no"></iframe>
        </div>
    </div>
    
    <a id="dynamicDownloadBtn" class="download-btn" href="#" target="_blank">تحميل الحلقة</a>

    <h3>قائمة الحلقات</h3>
    <div id="episodesList"><p class="loading-text">جاري تحميل الحلقات...</p></div>

    <!-- البطاقة المدمجة الذكية للعداد والمعلومات -->
    <div id="countdownContainer"></div>

    <footer>
        جميع الحقوق محفوظة © | <a href="https://t.me/anime_111PO" target="_blank">قناة التليكرام</a>
    </footer>

    <script>
        const API_URL = "https://anime-api-proxy.ffaa11afaf.workers.dev";
        const SECRET_PASS = "18001900m";
        const listContainer = document.getElementById('episodesList');
        const iframe = document.getElementById('videoPlayer');
        const downloadBtn = document.getElementById('dynamicDownloadBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const currentAnimeId = urlParams.get('id');
        const targetEpParam = urlParams.get('ep'); // قراءة رقم الحلقة المحددة من الرابط إن وجدت

        const daysArabic = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

        function decryptData(encryptedStr) {
            try {
                if(!encryptedStr) return null;
                const bytes = CryptoJS.AES.decrypt(encryptedStr, SECRET_PASS);
                const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                if(!decryptedText) return null;
                return JSON.parse(decodeURIComponent(decryptedText));
            } catch (e) {
                console.error("خطأ التشفير:", e);
                return null;
            }
        }

        // تحسين دالة الحفظ الذكي لتقدم المشاهدة (تمنع التراجع للحلقات الأقل)
        function saveToWatchHistory(animeId, epNum) {
            try {
                let history = JSON.parse(localStorage.getItem('animeHistory') || '[]');
                const existingItem = history.find(item => item.animeId === animeId);
                
                let epToSave = parseInt(epNum);

                // إذا كان الأنمي محفوظاً سابقاً برقم حلقة أعلى، نحتفظ بالرقم الأعلى
                if (existingItem && parseInt(existingItem.epNum) > epToSave) {
                    epToSave = parseInt(existingItem.epNum);
                }

                // تنظيف السجل القديم لهذا الأنمي
                history = history.filter(item => item.animeId !== animeId);
                
                // إعادة الحفظ في البداية برقم الحلقة المتقدم
                history.unshift({
                    animeId: animeId,
                    epNum: epToSave,
                    progress: 100,
                    timestamp: Date.now()
                });

                if(history.length > 5) history = history.slice(0, 5);
                localStorage.setItem('animeHistory', JSON.stringify(history));
            } catch(e) {
                console.error("خطأ حفظ السجل:", e);
            }
        }

        function loadVideo(url, element, epNum) {
            iframe.src = url;
            const encoded = btoa(url);
            downloadBtn.href = `download.html?link=${encoded}`;
            downloadBtn.style.display = 'block';
            downloadBtn.innerText = 'تحميل الحلقة (' + element.innerText + ')';

            document.querySelectorAll('.quality-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            if(epNum) saveToWatchHistory(currentAnimeId, epNum);
        }

        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            let animes = [];
            let rec = data.record ? data.record : data;

            if (rec && rec.encryptedData) {
                const decrypted = decryptData(rec.encryptedData);
                animes = decrypted ? (decrypted.animes || []) : [];
            } else if (rec && rec.animes) {
                animes = rec.animes;
            }

            const anime = animes.find(a => a.id === currentAnimeId);

            if (!anime) {
                listContainer.innerHTML = '<p style="color:red;">الأنمي المطلوب غير موجود</p>';
                document.getElementById('animeHeaderTitle').innerText = "خطأ في العرض";
                return;
            }

            document.getElementById('animeHeaderTitle').innerText = anime.title;
            document.title = `${anime.title} - الحلقات`;
            listContainer.innerHTML = '';

            const currentEpCount = anime.episodes ? anime.episodes.length : 0;

            if (!anime.episodes || anime.episodes.length === 0) {
                listContainer.innerHTML = '<p class="loading-text">لا توجد حلقات مضافة حالياً لهذا الأنمي</p>';
            } else {
                anime.episodes.forEach((episode) => {
                    const epSection = document.createElement('div');
                    epSection.className = 'ep-section';
                    epSection.setAttribute('data-ep', episode.ep);
                    
                    const epTitle = document.createElement('span');
                    epTitle.className = 'ep-title';
                    epTitle.innerText = `حلقة ${episode.ep}`;
                    epSection.appendChild(epTitle);

                    const linksContainer = document.createElement('div');
                    linksContainer.className = 'ep-links-container';
                    
                    episode.servers.forEach(server => {
                        if (server.embedUrl && server.embedUrl.trim() !== "") {
                            const qualityBtn = document.createElement('a');
                            qualityBtn.className = 'quality-btn';
                            qualityBtn.innerText = server.quality;
                            qualityBtn.onclick = () => loadVideo(server.embedUrl, qualityBtn, episode.ep);
                            linksContainer.appendChild(qualityBtn);
                        }
                    });

                    epSection.appendChild(linksContainer);
                    listContainer.appendChild(epSection);
                });

                // التوجيه المباشر والتشغيل التلقائي إذا جاء رقم الحلقة بالرابط (من سجل المشاهدات)
                if (targetEpParam) {
                    setTimeout(() => {
                        const targetSection = document.querySelector(`.ep-section[data-ep="${targetEpParam}"]`);
                        if (targetSection) {
                            targetSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            const targetBtn = targetSection.querySelector('.quality-btn');
                            if (targetBtn) targetBtn.click();
                        }
                    }, 400);
                }
            }

            setupSmartCountdown(anime, currentEpCount);
        })
        .catch(err => {
            console.error(err);
            listContainer.innerHTML = '<p style="color:red;">حدث خطأ أثناء تحميل البيانات</p>';
        });

        function setupSmartCountdown(anime, currentEpCount) {
            const container = document.getElementById('countdownContainer');
            const totalEps = anime.totalEps || 0;
            const nextEpNum = currentEpCount + 1;

            if (totalEps > 0 && currentEpCount >= totalEps) {
                container.innerHTML = `<div class="completed-badge">🎉 الأنمي مكتمل بالكامل (${currentEpCount}/${totalEps} حلقة)</div>`;
                return;
            }

            if (anime.airDay === undefined || !anime.airTime) return;

            const [hours, minutes] = anime.airTime.split(":").map(Number);

            function getNextTarget() {
                const now = new Date();
                let target = new Date(now);
                target.setHours(hours, minutes, 0, 0);

                let dayDiff = (anime.airDay - now.getDay() + 7) % 7;
                const resetRecently = anime.lastReset && (now.getTime() - anime.lastReset < 24 * 60 * 60 * 1000);

                if ((dayDiff === 0 && now.getTime() >= target.getTime()) || (dayDiff === 0 && resetRecently)) {
                    dayDiff = 7;
                }
                target.setDate(now.getDate() + dayDiff);
                return target;
            }

            let targetDateObj = getNextTarget();
            let targetDayName = daysArabic[targetDateObj.getDay()];
            let formattedDate = `${targetDateObj.getFullYear()}/${targetDateObj.getMonth()+1}/${targetDateObj.getDate()}`;

            const totalText = totalEps > 0 ? `من المتوقع أن يبلغ الأنمي <span class="info-highlight">${totalEps} حلقة</span> 📺` : 'أنمي مستمر 📺';

            container.innerHTML = `
                <div class="compact-info-card">
                    <div class="info-row">
                        <div>${totalText}</div>
                        <div>الحلقة <span class="info-highlight">${nextEpNum}</span> 🚀</div>
                    </div>
                    <div class="info-row info-date">
                        🗓️ تصدر يوم ${targetDayName}، ${formattedDate} الساعة ${anime.airTime}
                    </div>
                    <div class="compact-timer-box">
                        <span class="timer-label-sm">⏳ المتبقي للعرض:</span>
                        <div class="timer-values-sm">
                            <span class="timer-unit-sm" id="cDays">00d</span> :
                            <span class="timer-unit-sm" id="cHours">00h</span> :
                            <span class="timer-unit-sm" id="cMins">00m</span> :
                            <span class="timer-unit-sm" id="cSecs">00s</span>
                        </div>
                    </div>
                </div>
            `;

            function updateTimer() {
                const now = new Date().getTime();
                let diff = targetDateObj.getTime() - now;

                if (diff <= 0) {
                    targetDateObj = getNextTarget();
                    diff = targetDateObj.getTime() - now;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                const elD = document.getElementById('cDays');
                const elH = document.getElementById('cHours');
                const elM = document.getElementById('cMins');
                const elS = document.getElementById('cSecs');

                if (elD) elD.innerText = String(d).padStart(2, '0') + 'd';
                if (elH) elH.innerText = String(h).padStart(2, '0') + 'h';
                if (elM) elM.innerText = String(m).padStart(2, '0') + 'm';
                if (elS) elS.innerText = String(s).padStart(2, '0') + 's';
            }

            setInterval(updateTimer, 1000);
            updateTimer();
        }
    </script>
