<head>

    <meta charset="UTF-8">

    <style>
        * { box-sizing: border-box; font-family: sans-serif; text-decoration: none; }
        body { background: #0f0f12; color: white; margin: 0; padding: 15px 10px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        
        header { margin-bottom: 15px; }
        header h1 { font-size: 1.8rem; color: #ff9800; margin: 0 0 5px 0; font-weight: bold; }
        header p { color: #aaa; font-size: 0.85rem; margin: 0; }

        .container { max-width: 1000px; margin: 0 auto; width: 100%; text-align: right; }
        .section-title { font-size: 1.1rem; color: #fff; margin: 20px 0 10px 0; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }

        /* شريط البحث الذكي والنتائج المنبثقة */
        .search-container { position: relative; width: 100%; margin: 10px 0 20px 0; z-index: 100; }
        .search-input { width: 100%; padding: 12px 15px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 0.9rem; transition: 0.3s; outline: none; text-align: right; }
        .search-input:focus { border-color: #ff9800; box-shadow: 0 0 8px rgba(255, 152, 0, 0.2); }

        /* قائمة نتائج البحث المنسدلة المباشرة */
        .search-dropdown { display: none; position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: #18181c; border: 1px solid #333; border-radius: 8px; max-height: 320px; overflow-y: auto; box-shadow: 0 8px 25px rgba(0,0,0,0.8); z-index: 999; }
        .search-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #222; transition: 0.2s; cursor: pointer; text-decoration: none; }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: #222228; }
        .search-item-img { width: 45px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #333; flex-shrink: 0; }
        .search-item-info { display: flex; flex-direction: column; align-items: flex-start; text-align: right; overflow: hidden; }
        .search-item-title { font-size: 0.88rem; color: #fff; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .search-item-badge { font-size: 0.72rem; color: #ff9800; background: rgba(255, 152, 0, 0.12); padding: 2px 6px; border-radius: 4px; margin-top: 4px; font-weight: bold; }

        .search-empty-msg { padding: 18px; text-align: center; color: #ff9800; font-size: 0.88rem; font-weight: bold; }
        .search-prompt-msg { padding: 18px; text-align: center; color: #888; font-size: 0.85rem; }

        /* الإعلانات العلوية والسفلية وشريط التنبيه */
        .ad-container { margin: 10px auto; text-align: center; width: 100%; overflow: hidden; }
        .ad-label { color: #666; font-size: 0.75rem; margin: 25px 0 5px 0; text-align: center; letter-spacing: 1px; }

        /* 1. السلايدر العلوي الذكي */
        .slider-wrapper { position: relative; width: 100%; overflow: hidden; border-radius: 12px; margin-bottom: 25px; background: #1a1a1a; border: 1px solid #2a2a2a; touch-action: pan-y; user-select: none; }
        .slider-container { display: flex; transition: transform 0.4s ease-out; width: 100%; cursor: grab; }
        .slider-container:active { cursor: grabbing; }
        .slide-card { min-width: 100%; position: relative; height: 210px; display: block; overflow: hidden; }
        .slide-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75); pointer-events: none; }
        .slide-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; flex-direction: column; align-items: flex-start; pointer-events: none; }
        .slide-title { font-size: 1.2rem; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 4px; }
        .slide-badge { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid #ff9800; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        
        .slider-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.3s; cursor: pointer; }
        .dot.active { background: #ff9800; width: 20px; border-radius: 10px; }

        /* 2. شريط آخر المشاهدات */
        .continue-section { display: none; margin-bottom: 25px; }
        .continue-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .continue-card { min-width: 160px; max-width: 160px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; position: relative; flex-shrink: 0; }
        .continue-img { width: 100%; height: 90px; object-fit: cover; }
        .continue-info { padding: 8px; text-align: right; }
        .continue-ep { font-size: 0.8rem; color: #ff9800; font-weight: bold; }
        .continue-name { font-size: 0.75rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .progress-bar-bg { width: 100%; height: 3px; background: #333; margin-top: 6px; border-radius: 2px; }
        .progress-bar-fill { height: 100%; background: #ff9800; border-radius: 2px; }

        /* 3. شبكة الأنميات الأساسية */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; width: 100%; }
        .anime-card { background: #1a1a1a; border: 1px solid #252525; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; cursor: pointer; text-decoration: none; position: relative; }
        .anime-card:hover { border-color: #ff9800; transform: translateY(-3px); }
        .poster-box { position: relative; width: 100%; height: 190px; }
        .anime-poster { width: 100%; height: 100%; object-fit: cover; }
        .status-tag { position: absolute; top: 6px; right: 6px; background: #28a745; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .ep-tag { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.75); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; border: 1px solid #444; }
        .anime-title { font-size: 0.85rem; color: #fff; padding: 8px 5px; text-align: center; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        footer { margin-top: 20px; font-size: 0.85rem; color: #888; padding: 10px 0; text-align: center; }
        footer a { color: #ff9800; font-weight: bold; }

        .loading-text { color: #ff9800; font-size: 0.95rem; grid-column: 1 / -1; margin: 30px 0; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Stream season</h1>
            <p>شاهد أحدث الأنميات والحلقات المترجمة بدقة عالية</p>
        </header>

        <!-- شريط البحث ومُنسدل النتائج المباشر -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث..." oninput="handleLiveSearch()" onfocus="handleLiveSearch()">
            <div id="searchDropdown" class="search-dropdown"></div>
        </div>

        <!-- الشريط الإعلاني العلوي -->
        <div class="ad-container">
            <script src="https://pl30586730.effectivecpmnetwork.com/28/04/97/280497d1bc86158457d9ebfaec469991.js"></script>
        </div>

        <!-- 1. السلايدر العلوي -->
        <div class="slider-wrapper" id="sliderWrapper" style="display: none;">
            <div class="slider-container" id="sliderContainer"></div>
            <div class="slider-dots" id="sliderDots"></div>
        </div>

        <!-- 2. قسم آخر المشاهدات -->
        <div class="continue-section" id="continueSection">
            <div class="section-title">آخر المشاهدات</div>
            <div class="continue-grid" id="continueGrid"></div>
        </div>

        <!-- 3. قسم الإصدارات الحديثة -->
        <div class="section-title">الإصدارات الحديثة</div>

        <div class="anime-grid" id="animeGrid">
            <p class="loading-text">جاري تحميل قائمة الأنميات...</p>
        </div>

        <!-- شريط التنبيه الإعلاني الرمادي البسيط -->
        <div class="ad-label">----------اعلان----------</div>

        <!-- الشريط الإعلاني السفلي الإضافي -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://unprofessionalginger.com/c677bf44c6f94d1865a3c4c2a11f6675/invoke.js"></script>
            <div id="container-c677bf44c6f94d1865a3c4c2a11f6675"></div>
            <script src="https://pl30586282.effectivecpmnetwork.com/91/de/a9/91dea99a2c0107ea84bef42b886dbbae.js"></script>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © | <a href="https://t.me/anime_111PO" target="_blank">قناة التليكرام</a>
    </footer>

    <script>
        const API_URL = "https://anime-api-proxy.ffaa11afaf.workers.dev";
        const SECRET_PASS = "18001900m";
        
        let allAnimesList = [];
        let currentSlide = 0;
        let slideInterval;
        let resumeTimeout;
        let totalSlides = 0;

        function decryptData(encryptedStr) {
            try {
                if(!encryptedStr) return null;
                const bytes = CryptoJS.AES.decrypt(encryptedStr, SECRET_PASS);
                const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                if(!decryptedText) return null;
                return JSON.parse(decodeURIComponent(decryptedText));
            } catch (e) {
                console.error("خطأ في فك التشفير:", e);
                return null;
            }
        }

        fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            let sliderIds = [];
            let rec = data.record ? data.record : data;

            if (rec && rec.encryptedData) {
                const decrypted = decryptData(rec.encryptedData);
                if(decrypted) {
                    allAnimesList = decrypted.animes || [];
                    sliderIds = decrypted.sliderAnimes || [];
                }
            } else if (rec && rec.animes) {
                allAnimesList = rec.animes;
                sliderIds = rec.sliderAnimes || [];
            }

            setupSlider(allAnimesList, sliderIds);
            setupContinueWatching(allAnimesList);
            renderAnimeGrid(allAnimesList);
        })
        .catch(err => {
            console.error(err);
            document.getElementById('animeGrid').innerHTML = '<p style="color:red; grid-column:1/-1; text-align:center;">حدث خطأ أثناء جلب الأنميات</p>';
        });

        function normalizeText(str) {
            if (!str) return "";
            return str.toString()
                      .toLowerCase()
                      .replace(/[\-:_,\s]/g, "");
        }

        // دالة البحث المباشر المنبثق تحت الشريط
        function handleLiveSearch() {
            const searchInput = document.getElementById('searchInput');
            const dropdown = document.getElementById('searchDropdown');
            const rawQuery = searchInput.value.trim();
            const query = normalizeText(rawQuery);

            if (rawQuery === "") {
                dropdown.innerHTML = '<div class="search-prompt-msg">ما الذي ترغب بالبحث عنه؟</div>';
                dropdown.style.display = 'block';
                return;
            }

            const filtered = allAnimesList.filter(anime => {
                const normTitle = normalizeText(anime.title);
                const normId = normalizeText(anime.id);
                return normTitle.includes(query) || normId.includes(query);
            });

            dropdown.innerHTML = '';

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="search-empty-msg">سيضاف في الوقت القريب 🚀</div>';
            } else {
                filtered.forEach(anime => {
                    const lastEp = (anime.episodes && anime.episodes.length > 0) 
                        ? anime.episodes[anime.episodes.length - 1].ep 
                        : 1;

                    const item = document.createElement('a');
                    item.href = `episodes.html?id=${anime.id}`;
                    item.className = 'search-item';
                    item.innerHTML = `
                        <img src="${anime.poster}" class="search-item-img" alt="${anime.title}">
                        <div class="search-item-info">
                            <div class="search-item-title">${anime.title}</div>
                            <span class="search-item-badge">آخر حلقة: ${lastEp}</span>
                        </div>
                    `;
                    dropdown.appendChild(item);
                });
            }

            dropdown.style.display = 'block';
        }

        // إغلاق القائمة المنسدلة عند النقرة خارجها
        document.addEventListener('click', function(e) {
            const container = document.querySelector('.search-container');
            const dropdown = document.getElementById('searchDropdown');
            if (container && !container.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function setupSlider(animes, sliderIds) {
            const sliderWrapper = document.getElementById('sliderWrapper');
            const sliderContainer = document.getElementById('sliderContainer');
            const sliderDots = document.getElementById('sliderDots');

            if(!sliderIds || sliderIds.length === 0) return;

            let featuredAnimes = [];
            sliderIds.forEach(id => {
                const found = animes.find(a => a.id === id);
                if(found) featuredAnimes.push(found);
            });

            if(featuredAnimes.length === 0) return;

            totalSlides = featuredAnimes.length;
            sliderContainer.innerHTML = '';
            sliderDots.innerHTML = '';

            featuredAnimes.forEach((anime, index) => {
                const lastEp = (anime.episodes && anime.episodes.length > 0) 
                    ? anime.episodes[anime.episodes.length - 1].ep 
                    : 1;

                const slide = document.createElement('a');
                slide.href = `episodes.html?id=${anime.id}`;
                slide.className = 'slide-card';
                slide.innerHTML = `
                    <img src="${anime.poster}" class="slide-img" alt="${anime.title}">
                    <div class="slide-overlay">
                        <div class="slide-title">${anime.title}</div>
                        <div class="slide-badge">الحلقة ${lastEp}</div>
                    </div>
                `;
                sliderContainer.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = (e) => {
                    e.preventDefault();
                    pauseAndGoToSlide(index);
                };
                sliderDots.appendChild(dot);
            });

            sliderWrapper.style.display = 'block';

            enableTouchAndDrag(sliderWrapper);
            startAutoSlide();
        }

        function startAutoSlide() {
            stopAutoSlide();
            if(totalSlides > 1) {
                slideInterval = setInterval(() => {
                    currentSlide = (currentSlide + 1) % totalSlides;
                    updateSliderPosition();
                }, 4000);
            }
        }

        function stopAutoSlide() {
            if(slideInterval) clearInterval(slideInterval);
        }

        function pauseAndGoToSlide(index) {
            stopAutoSlide();
            if(resumeTimeout) clearTimeout(resumeTimeout);
            currentSlide = index;
            updateSliderPosition();
            resumeTimeout = setTimeout(() => {
                startAutoSlide();
            }, 2500);
        }

        function updateSliderPosition() {
            const container = document.getElementById('sliderContainer');
            container.style.transform = `translateX(${currentSlide * 100}%)`;
            
            const dots = document.querySelectorAll('.dot');
            dots.forEach((d, i) => {
                if(i === currentSlide) d.classList.add('active');
                else d.classList.remove('active');
            });
        }

        function enableTouchAndDrag(wrapper) {
            let startX = 0;
            let currentX = 0;
            let isDragging = false;

            const handleStart = (e) => {
                isDragging = true;
                startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                stopAutoSlide();
            };

            const handleMove = (e) => {
                if(!isDragging) return;
                currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            };

            const handleEnd = () => {
                if(!isDragging) return;
                isDragging = false;
                const diffX = startX - currentX;

                if(Math.abs(diffX) > 40) {
                    if(diffX < 0) { 
                        currentSlide = (currentSlide + 1) % totalSlides;
                    } else { 
                        currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                    }
                }
                
                pauseAndGoToSlide(currentSlide);
            };

            wrapper.addEventListener('touchstart', handleStart, {passive: true});
            wrapper.addEventListener('touchmove', handleMove, {passive: true});
            wrapper.addEventListener('touchend', handleEnd);

            wrapper.addEventListener('mousedown', handleStart);
            wrapper.addEventListener('mousemove', handleMove);
            wrapper.addEventListener('mouseup', handleEnd);
            wrapper.addEventListener('mouseleave', handleEnd);
        }

        function setupContinueWatching(animes) {
            const continueSection = document.getElementById('continueSection');
            const continueGrid = document.getElementById('continueGrid');
            const history = JSON.parse(localStorage.getItem('animeHistory') || '[]');

            if(history.length === 0) return;

            continueGrid.innerHTML = '';
            let count = 0;

            history.forEach(item => {
                const anime = animes.find(a => a.id === item.animeId);
                if(anime && count < 5) {
                    count++;
                    const percent = item.progress || 100;
                    const card = document.createElement('a');
                    card.href = `episodes.html?id=${anime.id}&ep=${item.epNum}`;
                    card.className = 'continue-card';
                    card.innerHTML = `
                        <img src="${anime.poster}" class="continue-img" alt="${anime.title}">
                        <div class="continue-info">
                            <div class="continue-ep">الحلقة ${item.epNum}</div>
                            <div class="continue-name">${anime.title}</div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                            </div>
                        </div>
                    `;
                    continueGrid.appendChild(card);
                }
            });

            if(count > 0) {
                continueSection.style.display = 'block';
            }
        }

        function renderAnimeGrid(animes) {
            const animeGrid = document.getElementById('animeGrid');
            animeGrid.innerHTML = '';

            if (animes.length === 0) {
                animeGrid.innerHTML = '<p class="loading-text">لا توجد أنميات مضافة حالياً</p>';
                return;
            }

            animes.forEach(anime => {
                const lastEp = (anime.episodes && anime.episodes.length > 0) 
                    ? anime.episodes[anime.episodes.length - 1].ep 
                    : 0;

                const card = document.createElement('a');
                card.href = `episodes.html?id=${anime.id}`;
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${anime.poster}" alt="${anime.title}" class="anime-poster">
                        <span class="status-tag">يعرض حالياً</span>
                        <span class="ep-tag">الحلقة : ${lastEp}</span>
                    </div>
                    <div class="anime-title">${anime.title}</div>
                `;
                animeGrid.appendChild(card);
            });
        }
    </script>

</body>
</html>
