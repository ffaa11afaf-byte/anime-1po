    <!-- مكتبة فك التشفير -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: sans-serif; text-decoration: none; }
        body { background: #121212; color: white; margin: 0; padding: 20px 10px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        
        header { margin-bottom: 25px; }
        header h1 { font-size: 1.6rem; color: #ff9800; margin: 0 0 5px 0; }
        header p { color: #aaa; font-size: 0.9rem; margin: 0; }

        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; width: 100%; }
        
        .anime-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; cursor: pointer; text-decoration: none; }
        .anime-card:hover { border-color: #ff9800; transform: translateY(-5px); box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2); }
        .anime-poster { width: 100%; height: 210px; border-radius: 8px; object-fit: cover; border: 1px solid #444; margin-bottom: 10px; }
        .anime-title { font-size: 0.95rem; color: #fff; height: 38px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.2; font-weight: bold; }
        .anime-card:hover .anime-title { color: #ff9800; }

        footer { margin-top: 30px; font-size: 0.85rem; color: #888; padding: 10px 0; }
        footer a { color: #ff9800; font-weight: bold; }
        footer a:hover { text-decoration: underline; }

        .loading-text { color: #ff9800; font-size: 1rem; grid-column: 1 / -1; margin: 30px 0; }
    </style>
</head>
<body>

    <div>
        <header>
            <h1> الصفحة الرئيسية </h1>
            <p>اختر الأنمي لمشاهدة الحلقات المترجمة بدقة عالية</p>
        </header>

        <div class="anime-grid" id="animeGrid">
            <p class="loading-text">جاري تحميل قائمة الأنميات...</p>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © | <a href="https://t.me/anime_111PO" target="_blank">قناة التليكرام</a>
    </footer>
    <footer>
        ------------اعلان-------------
    </footer>

    <script>
        const API_URL = "https://anime-api-proxy.ffaa11afaf.workers.dev";
        const SECRET_PASS = "18001900m";
        const animeGrid = document.getElementById('animeGrid');

        function decryptData(encryptedStr) {
            try {
                if(!encryptedStr) return null;
                const bytes = CryptoJS.AES.decrypt(encryptedStr, SECRET_PASS);
                const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                if(!decryptedText) return null;
                return JSON.parse(decodeURIComponent(decryptedText));
            } catch (e) {
                console.error("خطأ في فك التشفير:", e);
                return null;
            }
        }

        fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            let animes = [];
            let rec = data.record ? data.record : data;

            if (rec && rec.encryptedData) {
                const decrypted = decryptData(rec.encryptedData);
                animes = decrypted ? (decrypted.animes || []) : [];
            } 
            else if (rec && rec.animes) {
                animes = rec.animes;
            }

            animeGrid.innerHTML = '';

            if (animes.length === 0) {
                animeGrid.innerHTML = '<p class="loading-text">لا توجد أنميات مضافة حالياً</p>';
                return;
            }

            animes.forEach(anime => {
                const card = document.createElement('a');
                card.href = `episodes.html?id=${anime.id}`;
                card.className = 'anime-card';
                card.innerHTML = `
                    <img src="${anime.poster}" alt="${anime.title}" class="anime-poster">
                    <div class="anime-title">${anime.title}</div>
                `;
                animeGrid.appendChild(card);
            });
        })
        .catch(err => {
            console.error(err);
            animeGrid.innerHTML = '<p style="color:red; grid-column:1/-1;">حدث خطأ في جلب الأنميات</p>';
        });
    </script>
