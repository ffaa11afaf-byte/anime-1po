<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaStream - المشغل النظيف</title>
    <!-- مكتبة مشغل فيديو احترافية وخالية من الإعلانات (Plyr) -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body {
            background-color: #0f0f12;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1a1a24;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls-box {
            margin-top: 15px;
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            background: #18181c;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            text-align: left;
            direction: ltr;
        }
        button {
            padding: 10px 20px;
            background: #ff9800;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🎥 مشغل SeaStream النظيف (بدون إعلانات)</h2>

    <div class="player-container">
        <!-- مشغل الفيديو الخالي تماماً من وسائط الإعلانات -->
        <video id="cleanPlayer" controls playsinline poster="https://i.ibb.co/ksB7CMLK/P964379864.png">
            <source id="videoSource" src="" type="video/mp4" />
        </video>
    </div>

    <!-- مربع ادخال تجريبي للاختبار المباشر -->
    <div class="controls-box">
        <input type="text" id="directUrlInput" placeholder="أدخل رابط الفيديو المباشر (.mp4)...">
        <button onclick="playDirectStream()">تشغيل</button>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // تهيئة المشغل النظيف
        const player = new Plyr('#cleanPlayer', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            ratio: '16:9'
        });

        function playDirectStream() {
            const url = document.getElementById('directUrlInput').value.trim();
            if(!url) return alert('يرجى إدخال رابط فيديو صالح');

            const videoElement = document.getElementById('cleanPlayer');
            const sourceElement = document.getElementById('videoSource');

            sourceElement.src = url;
            videoElement.load();
            player.play();
        }
    </script>
</body>
</html>
